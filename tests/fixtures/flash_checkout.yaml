# A flash-sale checkout: create an order, reserve stock, charge the
# card, apply the payment — every hand-off an identified event on one
# keyed topic.
#
# Consistency is a property of transactions here, proven from the
# transactions themselves. The order object is versioned: applying a
# payment and cancelling an order both observe the order's version,
# validate it at commit, apply their transition, and bump it, so a
# stale observation rejects rather than commits — the OCC route that
# constrains every read-write anti-dependency between them, with
# create_order's insert in the same closure. apply_payment additionally
# persists the captured sequence through a successor cursor, which is
# what proves that payments apply to an order in sequence order. The
# runtime topology at the foot of the file describes placement and
# transport only; no proof here consumes it.
#
# The model keeps its deliberate gaps, and the checker reports each:
# tx.reserve_inventory reads stock and writes it back under read
# committed with neither a lock nor a version — the write-skew shape —
# so its serializability is unproven and its idempotency and
# recoverability with it; the card charge is explicitly not
# deduplicated, so no same-key terminal result is fixed and
# charge_payment's match on it is not established to replay; and
# create_order's idempotency is unknown through the cascade those
# consumers start.
dsl: 4
revision: 1
services:
  service.checkout:
    kind: backend
  service.inventory:
    kind: backend
  service.payments:
    kind: worker
schemas:
  schema.CreateOrderRequest:
    kind: canonical
    completeness: complete
    fields:
      idempotency_key: string
      order_id: uuid
      warehouse_id: uuid
      sku: string
      quantity: int
      amount: decimal
  schema.CreateOrderResponse:
    kind: canonical
    completeness: complete
    fields:
      order_id: uuid
      status: string
  schema.CancelOrderRequest:
    kind: canonical
    completeness: complete
    fields:
      order_id: uuid
  schema.CancelOrderResponse:
    kind: canonical
    completeness: complete
    fields:
      order_id: uuid
      status: string
  schema.TransferStockRequest:
    kind: canonical
    completeness: complete
    fields:
      source_warehouse_id: uuid
      destination_warehouse_id: uuid
      sku: string
      quantity: int
  schema.TransferStockResponse:
    kind: canonical
    completeness: complete
    fields:
      accepted: bool
  schema.RequestRejected:
    kind: canonical
    description: The err payload of a request the boundary refused.
    completeness: complete
    fields:
      reason: string
  schema.ChargeAccepted:
    kind: canonical
    description: The payment provider's ok payload.
    completeness: complete
    fields:
      authorization_id: string
  schema.ChargeDeclined:
    kind: canonical
    description: The payment provider's err payload.
    completeness: complete
    fields:
      reason: string
  schema.OrderCreated:
    kind: canonical
    completeness: complete
    fields:
      event_id: string
      order_id: uuid
      warehouse_id: uuid
      sku: string
      quantity: int
      amount: decimal
  schema.InventoryReserved:
    kind: canonical
    completeness: complete
    fields:
      event_id: string
      order_id: uuid
      warehouse_id: uuid
      sku: string
      quantity: int
      amount: decimal
  schema.PaymentCaptured:
    kind: canonical
    completeness: complete
    fields:
      event_id: string
      order_id: uuid
      sequence: int
      amount: decimal
  schema.PaymentFailed:
    kind: canonical
    completeness: complete
    fields:
      event_id: string
      order_id: uuid
      reason: string
  schema.OrderCancelled:
    kind: canonical
    completeness: complete
    fields:
      event_id: string
      order_id: uuid
  schema.OrderPaid:
    kind: canonical
    completeness: complete
    fields:
      event_id: string
      order_id: uuid
  schema.OrderRecord:
    kind: canonical
    completeness: complete
    fields:
      order_id: uuid
      status: string
      amount: decimal
      version: int
      last_applied_sequence: int
  schema.StockRecord:
    kind: canonical
    completeness: complete
    fields:
      warehouse_id: uuid
      sku: string
      on_hand: int
      reserved: int
data_models:
  data.checkout:
    objects:
      object.order:
        schema: schema.OrderRecord
        identity:
        - order_id
        # The order's application concurrency token: every mutation of
        # a live order bumps it, and a transaction that observed it
        # validates it at commit.
        version:
          field: version
  data.inventory:
    objects:
      object.stock:
        schema: schema.StockRecord
        identity:
        - warehouse_id
        - sku
topics:
  topic.order_events:
    messages:
    - schema.InventoryReserved
    - schema.OrderCancelled
    - schema.OrderCreated
    - schema.OrderPaid
    - schema.PaymentCaptured
    - schema.PaymentFailed
    message_identity:
      kind: keyed
      mapping:
        schema.InventoryReserved:
        - event_id
        schema.OrderCancelled:
        - event_id
        schema.OrderCreated:
        - event_id
        schema.OrderPaid:
        - event_id
        schema.PaymentCaptured:
        - event_id
        schema.PaymentFailed:
        - event_id
state_machines:
  machine.order_lifecycle:
    subject:
      kind: object
      object: object.order
      state: status
    states:
    - state.order.cancelled
    - state.order.paid
    - state.order.pending
    initial: state.order.pending
    transitions:
      transition.order.cancel:
        from:
        - state.order.pending
        to: state.order.cancelled
        side_effects: {}
      transition.order.mark_paid:
        from:
        - state.order.pending
        to: state.order.paid
        side_effects:
          effect.order.paid:
            kind: publication
            topic: topic.order_events
            schema: schema.OrderPaid
            idempotency_key_propagation: []
operations:
  operation.create_order:
    service: service.checkout
    description: Create an order and durably arrange publication of OrderCreated.
    inputs:
      input.create_order.request:
        kind: request
        schema: schema.CreateOrderRequest
        identity:
          kind: keyed
          fields:
          - idempotency_key
        result:
          ok: schema.CreateOrderResponse
          errors:
            rejected: schema.RequestRejected
    program:
      steps:
      - kind: transaction
        transaction:
          id: tx.create_order.new
          data_model: data.checkout
          isolation: read_committed
          idempotency:
            kind: deduplicated_by
            key:
              components:
              - source: input:input.create_order.request
                path: idempotency_key
          steps:
          - kind: insert
            object: object.order
            values:
              kind: deterministic
              from:
              - source: input:input.create_order.request
                path: order_id
              - source: input:input.create_order.request
                path: amount
          - kind: establish_effect_intent
            bind: intent.create_order.publish_created
            effect_id: effect.create_order.publish_created
            effect:
              kind: publication
              topic: topic.order_events
              schema: schema.OrderCreated
              idempotency_key_propagation:
              - source:
                  components:
                  - source: input:input.create_order.request
                    path: idempotency_key
                target:
                  components:
                  - source: effect:effect.create_order.publish_created
                    path: event_id
            values:
              kind: deterministic
              from:
              - source: input:input.create_order.request
                path: order_id
              - source: input:input.create_order.request
                path: idempotency_key
              - source: input:input.create_order.request
                path: warehouse_id
              - source: input:input.create_order.request
                path: sku
              - source: input:input.create_order.request
                path: quantity
              - source: input:input.create_order.request
                path: amount
          # status is the constant initial state, so the only provenance
          # root is the order id.
          - kind: establish_transaction_output
            bind: output.create_order
            schema: schema.CreateOrderResponse
            values:
              kind: deterministic
              from:
              - source: input:input.create_order.request
                path: order_id
      - kind: execute_effect_intent
        intent: intent.create_order.publish_created
      - kind: return
        request: input.create_order.request
        outcome:
          kind: ok
          values:
            kind: deterministic
            from:
            - source: transaction_output:output.create_order
              path: order_id
            - source: transaction_output:output.create_order
              path: status
    requirements:
      idempotency:
      - key:
          components:
          - source: input:input.create_order.request
            path: idempotency_key
        result: replay_consistent
      recoverability:
      - key:
          components:
          - source: input:input.create_order.request
            path: idempotency_key
        completion: resumable
  operation.reserve_inventory:
    service: service.inventory
    description: Reserve stock for an OrderCreated event.
    inputs:
      input.reserve_inventory.created:
        kind: subscription
        topic: topic.order_events
        messages:
          kind: only
          schemas:
          - schema.OrderCreated
    program:
      steps:
      - kind: transaction
        transaction:
          id: tx.reserve_inventory
          data_model: data.inventory
          isolation: read_committed
          idempotency:
            kind: not_deduplicated
          # The read-then-write of the stock row under read committed,
          # with neither a lock nor a version protocol: the write-skew
          # shape. The serializability obligation is deliberately left
          # unproven, and the checker names the unprotected
          # anti-dependency.
          requirements:
            serializability:
            - key:
                source: input:input.reserve_inventory.created
                path: order_id
          steps:
          - kind: read
            bind: read.reserve_inventory.stock
            target:
              object: object.stock
              predicate:
                kind: and
                predicates:
                - kind: eq
                  field: warehouse_id
                  value:
                    source: input:input.reserve_inventory.created
                    path: warehouse_id
                - kind: eq
                  field: sku
                  value:
                    source: input:input.reserve_inventory.created
                    path: sku
            fields:
              kind: only
              fields:
              - on_hand
              - reserved
          - kind: write
            target:
              object: object.stock
              predicate:
                kind: and
                predicates:
                - kind: eq
                  field: warehouse_id
                  value:
                    source: input:input.reserve_inventory.created
                    path: warehouse_id
                - kind: eq
                  field: sku
                  value:
                    source: input:input.reserve_inventory.created
                    path: sku
            fields:
            - reserved
            values:
              kind: deterministic
              from:
              - source: transaction_read:read.reserve_inventory.stock
                path: reserved
              - source: input:input.reserve_inventory.created
                path: quantity
          - kind: establish_effect_intent
            bind: intent.reserve_inventory.publish_reserved
            effect_id: effect.reserve_inventory.publish_reserved
            effect:
              kind: publication
              topic: topic.order_events
              schema: schema.InventoryReserved
              idempotency_key_propagation:
              - source:
                  components:
                  - source: input:input.reserve_inventory.created
                    path: event_id
                target:
                  components:
                  - source: effect:effect.reserve_inventory.publish_reserved
                    path: event_id
            values:
              kind: deterministic
              from:
              - source: input:input.reserve_inventory.created
                path: order_id
              - source: input:input.reserve_inventory.created
                path: event_id
              - source: input:input.reserve_inventory.created
                path: warehouse_id
              - source: input:input.reserve_inventory.created
                path: sku
              - source: input:input.reserve_inventory.created
                path: quantity
              - source: input:input.reserve_inventory.created
                path: amount
      - kind: execute_effect_intent
        intent: intent.reserve_inventory.publish_reserved
      - kind: complete
    requirements:
      idempotency:
      - key:
          components:
          - source: input:input.reserve_inventory.created
            path: event_id
        result: unspecified
      recoverability:
      - key:
          components:
          - source: input:input.reserve_inventory.created
            path: event_id
        completion: guaranteed
  operation.charge_payment:
    service: service.payments
    description: Charge the card after inventory reservation, announcing the capture or the decline.
    inputs:
      input.charge_payment.reserved:
        kind: subscription
        topic: topic.order_events
        messages:
          kind: only
          schemas:
          - schema.InventoryReserved
    program:
      steps:
      - kind: execute_effect
        effect_id: effect.charge_payment.card
        effect:
          kind: external
          name: payment-provider.charge
          identity:
            kind: unspecified
          idempotency: distinguishable
          result_replay: unspecified
          result:
            ok: schema.ChargeAccepted
            errors:
              declined: schema.ChargeDeclined
        values:
          kind: unspecified
        bind: result.charge_payment.card
      - kind: match_result
        result: result.charge_payment.card
        ok:
          steps:
          - kind: execute_effect
            effect_id: effect.charge_payment.publish_captured
            effect:
              kind: publication
              topic: topic.order_events
              schema: schema.PaymentCaptured
              idempotency_key_propagation:
              - source:
                  components:
                  - source: input:input.charge_payment.reserved
                    path: event_id
                target:
                  components:
                  - source: effect:effect.charge_payment.publish_captured
                    path: event_id
            values:
              kind: deterministic
              from:
              - source: input:input.charge_payment.reserved
                path: event_id
              - source: input:input.charge_payment.reserved
                path: order_id
              - source: input:input.charge_payment.reserved
                path: amount
          - kind: complete
        errors:
          declined:
            steps:
            # No modeled operation consumes PaymentFailed; the declined
            # arm exists to observe the provider's outcome.
            - kind: execute_effect
              effect_id: effect.charge_payment.publish_failed
              effect:
                kind: publication
                topic: topic.order_events
                schema: schema.PaymentFailed
                idempotency_key_propagation:
                - source:
                    components:
                    - source: input:input.charge_payment.reserved
                      path: event_id
                  target:
                    components:
                    - source: effect:effect.charge_payment.publish_failed
                      path: event_id
              values:
                kind: deterministic
                from:
                - source: input:input.charge_payment.reserved
                  path: event_id
                - source: input:input.charge_payment.reserved
                  path: order_id
                - source: effect_result_err:result.charge_payment.card
                  path: reason
            - kind: complete
    requirements:
      idempotency:
      - key:
          components:
          - source: input:input.charge_payment.reserved
            path: event_id
        result: unspecified
      recoverability: []
  operation.cancel_order:
    service: service.checkout
    description: Cancel a pending order and publish OrderCancelled; an order that is no longer pending rejects the transaction.
    inputs:
      input.cancel_order.request:
        kind: request
        schema: schema.CancelOrderRequest
        identity:
          kind: unspecified
        result:
          ok: schema.CancelOrderResponse
          errors:
            not_pending:
              schema: schema.RequestRejected
              disposition: terminal
    program:
      steps:
      - kind: transaction
        transaction:
          id: tx.cancel_order
          data_model: data.checkout
          isolation: read_committed
          # A transition transaction needs no keyed commit when nothing
          # declares a retry obligation over it: cancel_order carries no
          # idempotency or recoverability requirement, so the blocked
          # natural-replay route costs no proof.
          idempotency:
            kind: unspecified
          steps:
          - kind: read
            bind: read.cancel_order.order
            target:
              object: object.order
              predicate:
                kind: eq
                field: order_id
                value:
                  source: input:input.cancel_order.request
                  path: order_id
            fields:
              kind: only
              fields:
              - order_id
              - version
          - kind: validate_version
            target:
              object: object.order
              predicate:
                kind: eq
                field: order_id
                value:
                  source: input:input.cancel_order.request
                  path: order_id
            expected:
              source: transaction_read:read.cancel_order.order
              path: version
          - kind: transition
            machine: machine.order_lifecycle
            transition: transition.order.cancel
            subject:
              object: object.order
              predicate:
                kind: eq
                field: order_id
                value:
                  source: input:input.cancel_order.request
                  path: order_id
            effect_intents: {}
          - kind: bump_version
            target:
              object: object.order
              predicate:
                kind: eq
                field: order_id
                value:
                  source: input:input.cancel_order.request
                  path: order_id
          - kind: establish_effect_intent
            bind: intent.cancel_order.publish_cancelled
            effect_id: effect.cancel_order.publish_cancelled
            effect:
              kind: publication
              topic: topic.order_events
              schema: schema.OrderCancelled
              idempotency_key_propagation: []
            values:
              kind: deterministic
              from:
              - source: input:input.cancel_order.request
                path: order_id
        # The order was not pending, or its version moved under the
        # request: nothing committed, and the boundary says so.
        rejected:
          steps:
          - kind: return
            request: input.cancel_order.request
            outcome:
              kind: err
              error: not_pending
              values:
                kind: deterministic
                from:
                - source: input:input.cancel_order.request
                  path: order_id
      - kind: execute_effect_intent
        intent: intent.cancel_order.publish_cancelled
      - kind: return
        request: input.cancel_order.request
        outcome:
          kind: ok
          values:
            kind: deterministic
            from:
            - source: input:input.cancel_order.request
              path: order_id
    requirements:
      idempotency: []
      recoverability: []
  operation.apply_payment:
    service: service.checkout
    description: Advance a pending order to paid on PaymentCaptured, in capture sequence.
    inputs:
      input.apply_payment.captured:
        kind: subscription
        topic: topic.order_events
        messages:
          kind: only
          schemas:
          - schema.PaymentCaptured
    program:
      steps:
      - kind: transaction
        transaction:
          id: tx.apply_payment
          data_model: data.checkout
          isolation: read_committed
          idempotency:
            kind: deduplicated_by
            key:
              components:
              - source: input:input.apply_payment.captured
                path: event_id
          # Serializable by order through the version protocol below,
          # and ordered by the captured sequence through the successor
          # cursor on the order.
          requirements:
            serializability:
            - key:
                source: input:input.apply_payment.captured
                path: order_id
            ordering:
            - key:
                source: input:input.apply_payment.captured
                path: order_id
              position:
                source: input:input.apply_payment.captured
                path: sequence
          steps:
          - kind: read
            bind: read.apply_payment.order
            target:
              object: object.order
              predicate:
                kind: eq
                field: order_id
                value:
                  source: input:input.apply_payment.captured
                  path: order_id
            fields:
              kind: only
              fields:
              - order_id
              - version
              - last_applied_sequence
          - kind: validate_version
            target:
              object: object.order
              predicate:
                kind: eq
                field: order_id
                value:
                  source: input:input.apply_payment.captured
                  path: order_id
            expected:
              source: transaction_read:read.apply_payment.order
              path: version
          - kind: advance_cursor
            target:
              object: object.order
              predicate:
                kind: eq
                field: order_id
                value:
                  source: input:input.apply_payment.captured
                  path: order_id
            field: last_applied_sequence
            incoming:
              source: input:input.apply_payment.captured
              path: sequence
            rule: successor
          - kind: transition
            machine: machine.order_lifecycle
            transition: transition.order.mark_paid
            subject:
              object: object.order
              predicate:
                kind: eq
                field: order_id
                value:
                  source: input:input.apply_payment.captured
                  path: order_id
            effect_intents:
              effect.order.paid:
                bind: intent.apply_payment.order_paid
                values:
                  kind: deterministic
                  from:
                  - source: transaction_read:read.apply_payment.order
                    path: order_id
                  - source: input:input.apply_payment.captured
                    path: event_id
          - kind: bump_version
            target:
              object: object.order
              predicate:
                kind: eq
                field: order_id
                value:
                  source: input:input.apply_payment.captured
                  path: order_id
        # A stale or out-of-sequence capture, or an order no longer
        # pending, rejects: nothing is applied, and the delivery
        # completes without announcing anything.
        rejected:
          steps:
          - kind: complete
      - kind: execute_effect_intent
        intent: intent.apply_payment.order_paid
      - kind: complete
    requirements:
      idempotency:
      - key:
          components:
          - source: input:input.apply_payment.captured
            path: event_id
        result: unspecified
      recoverability:
      - key:
          components:
          - source: input:input.apply_payment.captured
            path: event_id
        completion: guaranteed
  operation.transfer_stock:
    service: service.inventory
    description: Move stock between warehouses.
    inputs:
      input.transfer_stock.request:
        kind: request
        schema: schema.TransferStockRequest
        identity:
          kind: unspecified
        result:
          ok: schema.TransferStockResponse
          errors:
            rejected: schema.RequestRejected
    program:
      steps:
      - kind: transaction
        transaction:
          id: tx.transfer_stock
          data_model: data.inventory
          isolation: read_committed
          idempotency:
            kind: unspecified
          steps:
          # The two exclusive locks below take the source and destination
          # rows as separate steps in program order with no acquisition
          # order between them, so a concurrent transfer in the opposite
          # direction may deadlock. The DSL cannot yet say otherwise and
          # no checker yet looks: serializability and deadlock freedom
          # are separate properties.
          - kind: lock
            target:
              object: object.stock
              predicate:
                kind: and
                predicates:
                - kind: eq
                  field: warehouse_id
                  value:
                    source: input:input.transfer_stock.request
                    path: source_warehouse_id
                - kind: eq
                  field: sku
                  value:
                    source: input:input.transfer_stock.request
                    path: sku
            mode: exclusive
            order:
              kind: unspecified
          - kind: lock
            target:
              object: object.stock
              predicate:
                kind: and
                predicates:
                - kind: eq
                  field: warehouse_id
                  value:
                    source: input:input.transfer_stock.request
                    path: destination_warehouse_id
                - kind: eq
                  field: sku
                  value:
                    source: input:input.transfer_stock.request
                    path: sku
            mode: exclusive
            order:
              kind: unspecified
          - kind: read
            bind: read.transfer_stock.source_stock
            target:
              object: object.stock
              predicate:
                kind: and
                predicates:
                - kind: eq
                  field: warehouse_id
                  value:
                    source: input:input.transfer_stock.request
                    path: source_warehouse_id
                - kind: eq
                  field: sku
                  value:
                    source: input:input.transfer_stock.request
                    path: sku
            fields:
              kind: only
              fields:
              - on_hand
          - kind: write
            target:
              object: object.stock
              predicate:
                kind: and
                predicates:
                - kind: eq
                  field: warehouse_id
                  value:
                    source: input:input.transfer_stock.request
                    path: source_warehouse_id
                - kind: eq
                  field: sku
                  value:
                    source: input:input.transfer_stock.request
                    path: sku
            fields:
            - on_hand
            values:
              kind: deterministic
              from:
              - source: transaction_read:read.transfer_stock.source_stock
                path: on_hand
              - source: input:input.transfer_stock.request
                path: quantity
          - kind: write
            target:
              object: object.stock
              predicate:
                kind: and
                predicates:
                - kind: eq
                  field: warehouse_id
                  value:
                    source: input:input.transfer_stock.request
                    path: destination_warehouse_id
                - kind: eq
                  field: sku
                  value:
                    source: input:input.transfer_stock.request
                    path: sku
            fields:
            - on_hand
            values:
              kind: unspecified
      - kind: return
        request: input.transfer_stock.request
        outcome:
          kind: ok
          values:
            kind: unspecified
    requirements:
      idempotency: []
      recoverability: []

# ---------------------------------------------------------------------
# L1 — one runtime realization of the machine above.
#
# Placement, transport, and capacity facts only. Three things this
# topology is chosen to make visible:
#
#   * reserve_inventory (service.inventory) and apply_payment
#     (service.checkout) share pool.order_workers. Services carry no
#     execution-topology meaning, so operations of different services
#     may share one execution population — and create_order, of the
#     same service as apply_payment, sits in a different pool.
#
#   * A shared pool is a shared execution population, not a shared
#     routing domain. Both subscriptions route by the same order_id
#     topic key, and nothing infers that their domains have a common
#     owner.
#
#   * None of it proves a transaction property. The serial worker pools
#     and the consistent-hash routing describe where same-order work
#     ordinarily lands; the version protocol and the sequence cursor on
#     the order are what make apply_payment serializable and ordered,
#     and they hold under redelivery, worker replacement, and a stale
#     worker that the topology cannot see.
# ---------------------------------------------------------------------
runtime:

  # Topic-scoped transport semantics: one grouping domain and one
  # ordering guarantee for every subscription of this topic, as a
  # partitioned log provides. No subscription may declare its own.
  topics:
    topic.order_events:
      grouping:
        schema.InventoryReserved: [order_id]
        schema.OrderCancelled: [order_id]
        schema.OrderCreated: [order_id]
        schema.OrderPaid: [order_id]
        schema.PaymentCaptured: [order_id]
        schema.PaymentFailed: [order_id]

      ordering: within_group

  execution_pools:
    pool.order_workers:
      member_concurrency:
        kind: bounded
        value: 1

    pool.payment_workers:
      member_concurrency:
        kind: bounded
        value: 1

    pool.checkout_api:
      member_concurrency:
        kind: unbounded

    pool.inventory_api:
      member_concurrency:
        kind: unbounded

  subscriptions:
    operation.reserve_inventory:
      input.reserve_inventory.created:
        delivery: at_least_once
        dispatch:
          pool: pool.order_workers
          routing:
            key: grouping_key
            member_assignment:
              kind: consistent_hash

    operation.charge_payment:
      input.charge_payment.reserved:
        delivery: at_least_once
        dispatch:
          pool: pool.payment_workers
          routing:
            key: grouping_key
            member_assignment:
              kind: consistent_hash

    operation.apply_payment:
      input.apply_payment.captured:
        delivery: at_least_once
        dispatch:
          pool: pool.order_workers
          routing:
            key: grouping_key
            member_assignment:
              kind: consistent_hash

  routers:
    # order_id is a routing key here and a partition key below. The
    # expressions coincide; the semantic identities do not, and the
    # analyzer never collapses them.
    router.create_order:
      boundary:
        operation: operation.create_order
        input: input.create_order.request
      pool: pool.checkout_api
      routing:
        key:
          - order_id
        member_assignment:
          kind: consistent_hash

    router.cancel_order:
      boundary:
        operation: operation.cancel_order
        input: input.cancel_order.request
      pool: pool.checkout_api

    router.transfer_stock:
      boundary:
        operation: operation.transfer_stock
        input: input.transfer_stock.request
      pool: pool.inventory_api

  storage_layouts:
    layout.order:
      object:
        data_model: data.checkout
        object: object.order
      partition_key:
        - order_id

    # A composite partition key, matching the object's own identity but
    # remaining a separate fact from it.
    layout.stock:
      object:
        data_model: data.inventory
        object: object.stock
      partition_key:
        - warehouse_id
        - sku
