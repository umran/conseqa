              - source:
                  kind: input
                  id: input.restock.request
                path:
                - quantity
          - kind: establish_transaction_output
            bind: output.restock.response
            schema: schema.RestockResponse
            values:
              kind: deterministic
              from:
              - source:
                  kind: input
                  id: input.restock.request
                path:
                - product_id
              - source:
                  kind: input
                  id: input.restock.request
                path:
                - request_id
      - kind: return
        request: input.restock.request
        outcome:
          kind: ok
          values:
            kind: deterministic
            from:
            - source:
                kind: transaction_output
                id: output.restock.response
              path:
              - product_id
            - source:
                kind: transaction_output
                id: output.restock.response
              path:
              - request_id
    requirements:
      idempotency:
      - key:
          components:
          - source:
              kind: input
              id: input.restock.request
            path:
            - request_id
        result: replay_consistent
      recoverability: []
  operation.ship_order:
    service: service.shop
    description: Marks a paid order shipped. Only paid orders ship, and an order ships at most once.
    inputs:
      input.ship_order.request:
        kind: request
        schema: schema.ShipOrderRequest
        identity:
          kind: keyed
          fields:
          - - request_id
        result:
          ok: schema.ShipOrderResponse
          errors:
            not_shippable:
              schema: schema.OrderStateConflict
              disposition: terminal
            order_not_found:
              schema: schema.OrderNotFound
              disposition: terminal
    program:
      steps:
      - kind: transaction
        transaction:
          id: tx.ship_order.inspect
          data_model: data.shop
          isolation: read_committed
          idempotency:
            kind: deduplicated_by
            key:
              components:
              - source:
                  kind: input
                  id: input.ship_order.request
                path:
                - request_id
          requirements:
            serializability: []
            ordering: []
          steps:
          - kind: read
            bind: read.ship_order.inspect
            target:
              object: object.order
              predicate:
                kind: eq
                field:
                - order_id
                value:
                  kind: value
                  value:
                    source:
                      kind: input
                      id: input.ship_order.request
                    path:
                    - order_id
            fields:
              kind: only
              fields:
              - - order_id
              - - status
              - - version
          - kind: validate_version
            target:
              object: object.order
              predicate:
                kind: eq
                field:
                - order_id
                value:
                  kind: value
                  value:
                    source:
                      kind: input
                      id: input.ship_order.request
                    path:
                    - order_id
            expected:
              source:
                kind: transaction_read
                id: read.ship_order.inspect
              path:
              - version
          - kind: establish_transaction_output
            bind: output.ship_order.lookup
            schema: schema.Order
            values:
              kind: deterministic
              from:
              - source:
                  kind: input
                  id: input.ship_order.request
                path:
                - order_id
              - source:
                  kind: transaction_read
                  id: read.ship_order.inspect
                path:
                - status
        rejected:
          steps:
          - kind: complete
      - kind: branch
        condition:
          kind: eq
          value:
            source:
              kind: transaction_output
              id: output.ship_order.lookup
            path:
            - status
          equals:
            kind: literal
            value:
              kind: string
              value: state.order.paid
        then:
          steps:
          - kind: transaction
            transaction:
              id: tx.ship_order
              data_model: data.shop
              isolation: read_committed
              idempotency:
                kind: deduplicated_by
                key:
                  components:
                  - source:
                      kind: input
                      id: input.ship_order.request
                    path:
                    - request_id
              requirements:
                serializability:
                - key:
                    source:
                      kind: input
                      id: input.ship_order.request
                    path:
                    - order_id
                ordering: []
              steps:
              - kind: read
                bind: read.ship_order.order
                target:
                  object: object.order
                  predicate:
                    kind: eq
                    field:
                    - order_id
                    value:
                      kind: value
                      value:
                        source:
                          kind: input
                          id: input.ship_order.request
                        path:
                        - order_id
                fields:
                  kind: only
                  fields:
                  - - order_id
                  - - status
                  - - version
              - kind: validate_version
                target:
                  object: object.order
                  predicate:
                    kind: eq
                    field:
                    - order_id
                    value:
                      kind: value
                      value:
                        source:
                          kind: input
                          id: input.ship_order.request
                        path:
                        - order_id
                expected:
                  source:
                    kind: transaction_read
                    id: read.ship_order.order
                  path:
                  - version
              - kind: transition
                machine: machine.order_lifecycle
                transition: transition.order.ship
                subject:
                  object: object.order
                  predicate:
                    kind: eq
                    field:
                    - order_id
                    value:
                      kind: value
                      value:
                        source:
                          kind: input
                          id: input.ship_order.request
                        path:
                        - order_id
                effect_intents: {}
                effects: {}
              - kind: bump_version
                target:
                  object: object.order
                  predicate:
                    kind: eq
                    field:
                    - order_id
                    value:
                      kind: value
                      value:
                        source:
                          kind: input
                          id: input.ship_order.request
                        path:
                        - order_id
              - kind: establish_transaction_output
                bind: output.ship_order.shipped
                schema: schema.ShipOrderResponse
                values:
                  kind: deterministic
                  from:
                  - source:
                      kind: input
                      id: input.ship_order.request
                    path:
                    - order_id
            rejected:
              steps:
              - kind: complete
          - kind: return
            request: input.ship_order.request
            outcome:
              kind: ok
              values:
                kind: deterministic
                from:
                - source:
                    kind: transaction_output
                    id: output.ship_order.shipped
                  path:
                  - order_id
        otherwise:
          steps:
          - kind: branch
            condition:
              kind: not
              condition:
                kind: and
                conditions:
                - kind: not
                  condition:
                    kind: eq
                    value:
                      source:
                        kind: transaction_output
                        id: output.ship_order.lookup
                      path:
                      - status
                    equals:
                      kind: literal
                      value:
                        kind: string
                        value: state.order.pending
                - kind: not
                  condition:
                    kind: eq
                    value:
                      source:
                        kind: transaction_output
                        id: output.ship_order.lookup
                      path:
                      - status
                    equals:
                      kind: literal
                      value:
                        kind: string
                        value: state.order.cancelled
                - kind: not
                  condition:
                    kind: eq
                    value:
                      source:
                        kind: transaction_output
                        id: output.ship_order.lookup
                      path:
                      - status
                    equals:
                      kind: literal
                      value:
                        kind: string
                        value: state.order.shipped
            then:
              steps:
              - kind: return
                request: input.ship_order.request
                outcome:
                  kind: err
                  error: not_shippable
                  values:
                    kind: deterministic
                    from:
                    - source:
                        kind: input
                        id: input.ship_order.request
                      path:
                      - order_id
            otherwise:
              steps:
              - kind: return
                request: input.ship_order.request
                outcome:
                  kind: err
                  error: order_not_found
                  values:
                    kind: deterministic
                    from:
                    - source:
                        kind: input
                        id: input.ship_order.request
                      path:
                      - order_id
    requirements:
      idempotency:
      - key:
          components:
          - source:
              kind: input
              id: input.ship_order.request
            path:
            - request_id
        result: replay_consistent
      recoverability: []
runtime:
  topics: {}
  subscriptions: {}
  execution_pools:
    pool.shop_api:
      member_concurrency:
        kind: unspecified
  routers:
    router.cancel_order:
      boundary:
        operation: operation.cancel_order
        input: input.cancel_order.request
      pool: pool.shop_api
    router.pay_order:
      boundary:
        operation: operation.pay_order
        input: input.pay_order.request
      pool: pool.shop_api
    router.place_order:
