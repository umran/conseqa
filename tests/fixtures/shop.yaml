    router.ship_order:
      boundary:
        operation: operation.ship_order
        input: input.ship_order.request
      pool: pool.shop_api
  storage_layouts:
    layout.order:
      object:
        data_model: data.shop
        object: object.order
      partition_key:
      - - order_id
    layout.payment:
      object:
        data_model: data.shop
        object: object.payment
      partition_key:
      - - order_id
    layout.product:
      object:
        data_model: data.shop
        object: object.product
      partition_key:
      - - product_id
    layout.restock_receipt:
      object:
        data_model: data.shop
        object: object.restock_receipt
      partition_key:
      - - request_id
