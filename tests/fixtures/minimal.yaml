revision: 1

services:
    checkout:
        kind: backend

schemas:
    OrderCreated:
        kind: canonical
        description: An order accepted by checkout.
        completeness: complete
        fields:
            order_id: uuid
            quantity: int

data_models: {}

topics:
    order_events:
        messages:
            - OrderCreated
        message_identity:
            kind: unspecified

state_machines: {}

operations: {}

# The transport fact the topic used to carry: an explicit negative
# ordering guarantee, which is L1 because it describes the realization
# rather than the logical channel.
runtime:
    topics:
        order_events:
            ordering:
                kind: unordered
