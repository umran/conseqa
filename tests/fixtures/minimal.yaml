dsl: 3
revision: 1

services:
    checkout:
        kind: backend

schemas:
    OrderCreated:
        kind: canonical
        description: An order accepted by checkout.
        completeness: complete
        fields:
            order_id: uuid
            quantity: int

data_models: {}

topics:
    order_events:
        messages:
            - OrderCreated
        message_identity:
            kind: unspecified

state_machines: {}

operations: {}

# This transport neither groups nor orders — both facts are simply
# absent. Transport facts are L1 because they describe the realization
# rather than the logical channel.
runtime:
    topics:
        order_events: {}
