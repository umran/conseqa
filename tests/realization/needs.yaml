video_streaming.yaml:
  data_model data.transcoder: ["durability: committed", "isolation: serializable", "transaction: multi_instance", "mutation: conditional", "uniqueness: identity"]
  data_model data.videos: ["durability: committed", "isolation: serializable", "transaction: interactive", "mutation: conditional", "uniqueness: identity"]
  topic topic.video_events: ["channel: fanout"]
  topic_runtime topic.video_events: ["grouping: keyed", "ordering: within_group"]
  subscription_runtime operation.notify_published/input.notify_published.published: ["delivery: at_least_once", "assignment: consistent_hash"]
  subscription_runtime operation.publish_video/input.publish_video.completed: ["delivery: at_least_once", "assignment: consistent_hash"]
  subscription_runtime operation.transcode_video/input.transcode_video.uploaded: ["delivery: at_least_once", "assignment: consistent_hash"]
  execution_pool pool.catalog_workers: ["concurrency: bounded"]
  execution_pool pool.ingest_api: []
  execution_pool pool.notifier_workers: ["concurrency: bounded"]
  execution_pool pool.playback_readers: ["concurrency: bounded"]
  execution_pool pool.transcode_workers: ["concurrency: bounded"]
  router router.complete_upload: []
  router router.get_playback: ["assignment: consistent_hash"]
  storage_layout layout.transcode_job: ["partitioning: keyed"]
  storage_layout layout.video: ["partitioning: keyed"]
