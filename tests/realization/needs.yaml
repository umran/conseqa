# What each fixture's realizable declarations need (§20.1 of the
# realization profiles revision), written by hand from the fixtures'
# transactions and runtime declarations, never from the derivation's
# output. Capabilities are listed in the vocabulary's order (§6.2).
#
# Two readings to check against: an insert counts as an instance of its
# own, since its derivation names no identity, so video_streaming's
# claim (insert, then transition) writes several instances; and
# reading a binding into a transaction output is a decision resting on
# a read, so shop's inspections are interactive.

flash_checkout.yaml:
  data_model data.checkout: ["durability: committed", "isolation: read_committed", "transaction: interactive", "mutation: conditional", "uniqueness: identity"]
  data_model data.inventory: ["durability: committed", "isolation: read_committed", "transaction: interactive", "transaction: multi_instance", "lock: exclusive"]
  topic topic.order_events: ["channel: fanout"]
  topic_runtime topic.order_events: ["grouping: keyed", "ordering: within_group"]
  subscription_runtime operation.apply_payment/input.apply_payment.captured: ["delivery: at_least_once", "assignment: consistent_hash"]
  subscription_runtime operation.charge_payment/input.charge_payment.reserved: ["delivery: at_least_once", "assignment: consistent_hash"]
  subscription_runtime operation.reserve_inventory/input.reserve_inventory.created: ["delivery: at_least_once", "assignment: consistent_hash"]
  execution_pool pool.checkout_api: []
  execution_pool pool.inventory_api: []
  execution_pool pool.order_workers: ["concurrency: bounded"]
  execution_pool pool.payment_workers: ["concurrency: bounded"]
  router router.cancel_order: []
  router router.create_order: ["assignment: consistent_hash"]
  router router.transfer_stock: []
  storage_layout layout.order: ["partitioning: keyed"]
  storage_layout layout.stock: ["partitioning: composite"]

hedged_read.yaml:
  topic topic.reads: ["channel: fanout"]

keyed_topic.yaml:
  topic order_events: ["channel: fanout"]
  topic_runtime order_events: ["grouping: keyed", "ordering: within_group"]

minimal.yaml:
  topic order_events: ["channel: fanout"]
  topic_runtime order_events: []

payment_capture.yaml:
  data_model data.ledger: ["durability: committed", "isolation: read_committed", "uniqueness: identity"]
  data_model data.payments: ["durability: committed", "isolation: read_committed", "transaction: multi_instance", "uniqueness: identity", "outbox: atomic"]
  outbox data.payments/outbox.payment_events: ["redrive: durable"]
  topic topic.payment_events: ["channel: fanout"]
  subscription_runtime operation.post_ledger_entry/input.post_ledger_entry.captured: ["delivery: at_least_once"]
  outbox_runtime operation.publish_payment_event/input.publish_payment_event.outbox: ["grouping: keyed", "ordering: within_group", "assignment: consistent_hash"]
  execution_pool pool.ledger_workers: ["concurrency: bounded"]
  execution_pool pool.relay_workers: ["concurrency: bounded"]

