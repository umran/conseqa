[package]
name = "conseqa"
version = "0.1.0"
edition = "2024"

[features]
default = ["confluence"]

# The agent-confluence layer: versioned draft workspaces, the semantic
# symbol graph, the OCC commit engine, and the MCP surface. On by
# default; `--no-default-features` still builds the lean checker.
confluence = [
    "dep:arc-swap",
    "dep:blake3",
    "dep:rustc-hash",
    "dep:smallvec",
    "dep:thiserror",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
serde_json = "1"

arc-swap = { version = "1", optional = true }
blake3 = { version = "1", optional = true }
rustc-hash = { version = "2", optional = true }
smallvec = { version = "1", optional = true }
thiserror = { version = "2", optional = true }

[[test]]
name = "confluence_graph"
required-features = ["confluence"]

[[bin]]
name = "conseqa"
path = "src/main.rs"

[[bin]]
name = "conseqa-viz"
path = "src/bin/viz/main.rs"
