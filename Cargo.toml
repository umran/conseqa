[package]
name = "conseqa"
version = "0.1.0"
edition = "2024"

[features]
default = ["design", "system-one"]

# The agent-design layer: versioned draft workspaces, the semantic
# symbol graph, the OCC commit engine, and the MCP surface. On by
# default; `--no-default-features` still builds the core library.
design = [
    "dep:arc-swap",
    "dep:async-trait",
    "dep:axum",
    "dep:axum-server",
    "dep:blake3",
    "dep:clap",
    "dep:futures",
    "dep:rcgen",
    "dep:rustls",
    "dep:getrandom",
    "dep:http",
    "dep:parking_lot",
    "dep:rmcp",
    "dep:rustc-hash",
    "dep:schemars",
    "dep:smallvec",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
]

# The System One layer: typed closed-set decisions behind the `Decider`
# trait, with the wire-format HTTP backend (the hosted service or any
# local server that speaks the format), deterministic replay, and a
# shadow comparator. On by default so design runs launched by the MCP
# server can use a configured decider; `--no-default-features
# --features design` still builds without an HTTP client.
system-one = ["design", "dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
serde_json = "1"

arc-swap = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true }
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }
futures = { version = "0.3", optional = true }
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23", optional = true }
blake3 = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
getrandom = { version = "0.3", optional = true }
http = { version = "1", optional = true }
parking_lot = { version = "0.12", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
rmcp = { version = "3", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
], optional = true }
rustc-hash = { version = "2", optional = true }
schemars = { version = "1", optional = true }
smallvec = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = [
    "sync",
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "io-util",
    "signal",
    "time",
], optional = true }
tokio-util = { version = "0.7", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "design_graph"
required-features = ["design"]

[[test]]
name = "design_occ"
required-features = ["design"]

[[test]]
name = "design_mcp"
required-features = ["design"]

[[test]]
name = "design_stdio"
required-features = ["design"]

[[test]]
name = "conseqa_cli"
required-features = ["design"]

[[test]]
name = "design_analysis"
required-features = ["design"]

[[test]]
name = "spec_change"
required-features = ["design"]

[[test]]
name = "harness_backends"
required-features = ["design"]

[[test]]
name = "harness_workflow"
required-features = ["design"]

[[test]]
name = "harness_live"
required-features = ["design"]

[[test]]
name = "system_one"
required-features = ["system-one"]

[[bin]]
name = "conseqa"
path = "src/main.rs"
required-features = ["design"]

[[bin]]
name = "conseqa-design-mcp"
path = "src/bin/design_mcp/main.rs"
required-features = ["design"]
