[package]
name = "conseqa"
version = "0.1.0"
edition = "2024"

[features]
default = ["confluence"]

# The agent-confluence layer: versioned draft workspaces, the semantic
# symbol graph, the OCC commit engine, and the MCP surface. On by
# default; `--no-default-features` still builds the lean checker.
confluence = [
    "dep:arc-swap",
    "dep:async-trait",
    "dep:axum",
    "dep:blake3",
    "dep:clap",
    "dep:getrandom",
    "dep:http",
    "dep:parking_lot",
    "dep:redb",
    "dep:rmcp",
    "dep:rustc-hash",
    "dep:schemars",
    "dep:smallvec",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
serde_json = "1"

arc-swap = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true }
blake3 = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
getrandom = { version = "0.3", optional = true }
http = { version = "1", optional = true }
parking_lot = { version = "0.12", optional = true }
redb = { version = "4", optional = true }
rmcp = { version = "3", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
], optional = true }
rustc-hash = { version = "2", optional = true }
schemars = { version = "1", optional = true }
smallvec = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = [
    "sync",
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "io-util",
    "signal",
    "time",
], optional = true }
tokio-util = { version = "0.7", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "confluence_graph"
required-features = ["confluence"]

[[test]]
name = "confluence_occ"
required-features = ["confluence"]

[[test]]
name = "confluence_mcp"
required-features = ["confluence"]

[[test]]
name = "confluence_analysis"
required-features = ["confluence"]

[[test]]
name = "harness_backends"
required-features = ["confluence"]

[[test]]
name = "harness_workflow"
required-features = ["confluence"]

[[test]]
name = "harness_live"
required-features = ["confluence"]

[[bin]]
name = "conseqa"
path = "src/main.rs"

[[bin]]
name = "conseqa-confluence"
path = "src/bin/confluence/main.rs"
required-features = ["confluence"]

[[bin]]
name = "conseqa-harness"
path = "src/bin/harness/main.rs"
required-features = ["confluence"]

[[bin]]
name = "conseqa-viz"
path = "src/bin/viz/main.rs"
